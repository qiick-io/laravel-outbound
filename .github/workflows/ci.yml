name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, intl
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan

      - name: Pest
        run: vendor/bin/pest

      # The fleet erasure suite (E1–E14), by path: phpunit.xml cannot leave it out.
      - run: node tests/Erasure/run.mjs

  real-transport:
    name: Real transport Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported Guzzle 7 (composer.json ^7.15.2 || ^8.0.1): the
          # first 7.x without a published advisory, and like every 7.x since
          # 7.12 it pins CURLOPT_NOPROXY, so NO_PROXY cannot send around the
          # egress proxy.
          - guzzle: '7.15.2'
            prefer: lowest
          # Current stable Guzzle 8.
          - guzzle: '8.5'
            prefer: stable
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, intl
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update "illuminate/support:^13.0" "illuminate/http:^13.0" "illuminate/contracts:^13.0" "illuminate/database:^13.0"
          composer require --no-interaction --no-update "guzzlehttp/guzzle:^${{ matrix.guzzle }}"
          if [ "${{ matrix.prefer }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi
          composer show guzzlehttp/guzzle | head -5

      # Evidence for the supported floor: the lowest Guzzle a product can
      # resolve has no published advisory.
      - name: Composer audit
        run: composer audit

      - name: Real-transport Pest
        run: vendor/bin/pest --group=real-transport

  # Split over three jobs: one serial run outgrew 45 minutes. The required
  # check is the `mutate` job below, which passes only if every shard did.
  mutate-shard:
    name: Mutation shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: curl, intl
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update "illuminate/support:^13.0" "illuminate/http:^13.0" "illuminate/contracts:^13.0" "illuminate/database:^13.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate per class
        env:
          MUTATE_SHARD: ${{ matrix.shard }}/3
        run: bash scripts/mutate-per-class.sh

  mutate:
    name: Mutation (per-class ≥95%)
    if: always()
    needs: mutate-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutate-shard.result }}" = success

  # The package ships migrations (1.0 checklist item 6): the suite also runs on
  # each server engine, not only on in-memory SQLite. Webhook ids and event
  # types are case-sensitive, and the MySQL family's default collations are not.
  databases:
    name: Pest on ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            connection: mysql
            image: mysql:8.4
            port: 3306
            options: >-
              -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=laravel_outbound
              --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
          # The fleet package matrix (app-ui standards/package-matrix.json).
          - name: MariaDB 11.4
            connection: mariadb
            image: mariadb:11.4
            port: 3306
            options: >-
              -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes -e MARIADB_DATABASE=laravel_outbound
              --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
          - name: PostgreSQL 17
            connection: pgsql
            image: postgres:17
            port: 5432
            options: >-
              -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=laravel_outbound
              --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, intl, pdo_mysql, pdo_pgsql, pcntl, posix
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: laravel_outbound
          DB_USERNAME: ${{ matrix.database.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ''
        run: vendor/bin/pest --exclude-group=real-transport

      - name: Erasure suite
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: laravel_outbound
          DB_USERNAME: ${{ matrix.database.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ''
        run: node tests/Erasure/run.mjs

  # The qiick standards pack (agent files, architecture test) must match app-ui.
  standards:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true
      registry: false
