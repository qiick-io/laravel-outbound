name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-matrix:
    uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      app-ui-ref: 0d97ae1429a856411c76e6de1ec258cae0eabab6

  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, intl
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: ${{ !matrix.skip && matrix.dependency-version == 'stable' }}
        run: vendor/bin/pint --test

      - name: PHPStan
        if: ${{ !matrix.skip && matrix.dependency-version == 'stable' }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        if: ${{ !matrix.skip }}
        run: node scripts/qiick-ratchet.mjs phpstan

      - name: Pest
        if: ${{ !matrix.skip }}
        run: vendor/bin/pest --fail-on-empty-test-suite

      # E1–E14 is required even for the shared matrix's docs-only cell.
      - run: node tests/Erasure/run.mjs

  real-transport:
    name: Real transport Guzzle ${{ matrix.guzzle }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exact supported floors from composer.json. A newer patch must not
        # mask an advisory or a transport regression at either floor.
        guzzle: ['7.15.2', '8.0.1']
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.docs-only != 'true'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        if: needs.package-matrix.outputs.docs-only != 'true'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, intl
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update "illuminate/support:^13.0" "illuminate/http:^13.0" "illuminate/contracts:^13.0" "illuminate/database:^13.0"
          composer require --no-interaction --no-update "guzzlehttp/guzzle:${{ matrix.guzzle }}"
          composer update --no-interaction --prefer-dist --with-all-dependencies
          composer show guzzlehttp/guzzle

      # Fail on an advisory affecting either supported floor or its dependencies.
      - name: Composer audit
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer audit

      - name: Real-transport Pest
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/pest --group=real-transport --fail-on-empty-test-suite

  redis-claims:
    name: Redis webhook claims
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: ${{ needs.package-matrix.outputs.docs-only != 'true' && 'redis:7.4.12@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738' || '' }}
        ports:
          - 6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
        if: needs.package-matrix.outputs.docs-only != 'true'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: needs.package-matrix.outputs.docs-only != 'true'
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, intl, redis
          tools: composer:v2
      - name: Install dependencies
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies
      - name: Concurrent claim and release
        if: needs.package-matrix.outputs.docs-only != 'true'
        env:
          OUTBOUND_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: vendor/bin/pest --group=redis-claim --fail-on-empty-test-suite --fail-on-skipped

  # A test-only PR still runs Pest and the server databases. With no
  # changed source file, its mutation gate succeeds without generating mutants.
  # Split over three jobs: one serial run outgrew 45 minutes. The required
  # check is the `mutate` job below, which passes only if every shard did.
  mutate-shard:
    name: Mutation shard ${{ matrix.shard }}/3
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MUTATE_SCOPE: ${{ needs.package-matrix.outputs.mutate-scope }}
      MUTATE_CLASSES: ${{ needs.package-matrix.outputs.mutate-classes }}
    steps:
      - name: Checkout
        if: env.MUTATE_SCOPE == 'all' || env.MUTATE_CLASSES != '[]'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        if: env.MUTATE_SCOPE == 'all' || env.MUTATE_CLASSES != '[]'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: curl, intl
          tools: composer:v2

      - name: Install dependencies
        if: env.MUTATE_SCOPE == 'all' || env.MUTATE_CLASSES != '[]'
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^11.0"
          composer require --no-interaction --no-update "illuminate/support:^13.0" "illuminate/http:^13.0" "illuminate/contracts:^13.0" "illuminate/database:^13.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate per class
        if: env.MUTATE_SCOPE == 'all' || env.MUTATE_CLASSES != '[]'
        env:
          MUTATE_SHARD: ${{ matrix.shard }}/3
        run: bash scripts/mutate-per-class.sh

  mutate:
    name: Mutation (per-class ≥95%)
    if: always()
    needs: mutate-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutate-shard.result }}" = success

  # The package ships migrations (1.0 checklist item 6): the suite also runs on
  # each server engine, not only on in-memory SQLite. Webhook ids and event
  # types are case-sensitive, and the MySQL family's default collations are not.
  databases:
    name: Pest on ${{ matrix.database.name }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
    services:
      database:
        # v0.15.0's path classifier misses some database users. Until the
        # fleet changes that output, exercise every non-docs change here.
        image: ${{ (needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true') && matrix.database.image || '' }}
        env: ${{ matrix.database.environment }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.docs-only != 'true'
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup PHP
        if: needs.package-matrix.outputs.docs-only != 'true'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, intl, pdo_mysql, pdo_pgsql, pcntl, posix
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest
        if: needs.package-matrix.outputs.docs-only != 'true'
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: qiick_package
          DB_USERNAME: ${{ matrix.database.username }}
          DB_PASSWORD: ${{ matrix.database.password }}
        run: vendor/bin/pest --exclude-group=real-transport --fail-on-empty-test-suite

      - name: Erasure suite
        if: needs.package-matrix.outputs.docs-only != 'true'
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: qiick_package
          DB_USERNAME: ${{ matrix.database.username }}
          DB_PASSWORD: ${{ matrix.database.password }}
        run: node tests/Erasure/run.mjs

  # The qiick standards pack (agent files, architecture test) must match app-ui.
  standards:
    # qiick-io/app-ui@v0.15.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true
      registry: false

  workflow-pins:
    name: Workflow action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: qiick-io/app-ui
          ref: 0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
          path: .app-ui
          sparse-checkout: standards/scripts
      - name: Check F15 workflow references
        run: |
          node --input-type=module -e '
            import { findUnpinnedWorkflowReferences } from "./.app-ui/standards/scripts/check-conventions.mjs";
            const errors = findUnpinnedWorkflowReferences(process.cwd());
            if (errors.length) {
              console.error(errors.join("\n"));
              process.exitCode = 1;
            }
          '

  nightly-failure:
    needs: [package-matrix, tests, databases, real-transport, redis-claims, mutate, standards, workflow-pins]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for a failed nightly run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly CI failed on $(date -u +%F)" --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --label bug
